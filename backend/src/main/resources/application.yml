server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: pancita-fashion-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:pancita_fashion}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    open-in-view: false
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
